<!-- Supabase → Authentication → Emails → Templates → "Confirm signup" (pegar completo; el enlace usa Site URL = https://mediogol.cl)
     Asunto: Confirma tu cuenta de MedioGol -->
<div style="margin:0;padding:24px 12px;background:#f2f4f1;font-family:Arial,Helvetica,sans-serif;color:#0c1a2e">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #e3e7e2">
    <div style="background:#0f2240;padding:20px 24px">
      <span style="font-size:22px;font-weight:800;letter-spacing:.5px;color:#ffffff">MEDIO<span style="color:#3fbf6a">GOL</span></span>
    </div>
    <div style="padding:24px">
      <h1 style="margin:0 0 12px;font-size:22px">¡Bienvenido a MedioGol!</h1>
      <p style="margin:0 0 20px;font-size:15px;line-height:22px;color:#3d4a5c">
        Confirma tu correo para activar tu cuenta y seguir tu liga, tu equipo y tus goles.
      </p>
      <p style="margin:0 0 24px">
        <a href="{{ .SiteURL }}/confirmar?token_hash={{ .TokenHash }}&type=email" style="display:inline-block;background:#1a7f3c;color:#ffffff;text-decoration:none;font-weight:700;font-size:15px;padding:14px 22px;border-radius:10px">Confirmar mi correo</a>
      </p>
      <p style="margin:0;font-size:13px;line-height:19px;color:#5b6676">Si no creaste una cuenta en MedioGol, ignora este correo.</p>
      <p style="margin:16px 0 0;font-size:13px;color:#5b6676">¿Dudas? Escríbenos a <a href="mailto:contacto@mediogol.cl" style="color:#1a7f3c">contacto@mediogol.cl</a></p>
    </div>
  </div>
</div>
